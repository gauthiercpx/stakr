name: Backend - Build, Migrate & Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Required to push to GitHub Container Registry with GITHUB_TOKEN.
  packages: write

# A newer push to the same branch supersedes an in-flight deploy. Without this,
# two runs can race each other into `containerapp update` and the older image
# can win.
concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: rg-stakr-prod
  CONTAINER_APP_NAME: stakr-backend
  CONTAINER_ENV: env-stakr
  MIGRATION_JOB_NAME: stakr-backend-migrate

jobs:
  # ---------------------------------------------------------------------
  # 1) Build
  # ---------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repo: ${{ steps.meta.outputs.repo }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image reference and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^APP_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            backend/app/core/version.py | head -n 1)
          if [[ -z "$VERSION" ]]; then
            echo "::error file=backend/app/core/version.py::Could not extract APP_VERSION"
            exit 1
          fi

          # Registry paths must be lowercase; GitHub owner names need not be.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO="${REGISTRY}/${OWNER}/stakr-backend"

          {
            echo "version=${VERSION}"
            echo "repo=${REPO}"
            echo "image=${REPO}:sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Backend version: ${VERSION}"
          echo "Image: ${REPO}:sha-${GITHUB_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushing uses the job-scoped GITHUB_TOKEN, which expires with the run.
      # Only the *pull* side needs a long-lived credential (see GHCR_PULL_TOKEN
      # in the migrate and deploy jobs).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is backend/ only. The frontend is deployed to Cloudflare
      # Pages and is no longer built into this image, so a backend push no
      # longer pays for `npm ci` + `vite build`.
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          # Registry-backed layer cache. Ephemeral runners start with a cold
          # Docker cache, so without this every run reinstalls the whole
          # dependency tree.
          cache-from: type=registry,ref=${{ steps.meta.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.repo }}:buildcache,mode=max
          tags: |
            ${{ steps.meta.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}:latest

  # ---------------------------------------------------------------------
  # 2) Migrate
  # ---------------------------------------------------------------------
  # Migrations run once per deploy, as their own short-lived Container Apps
  # job, instead of on every container start. This keeps Alembic off the
  # cold-start path and guarantees the schema is current before the new image
  # serves traffic. A failure here stops the deploy job from running.
  migrate:
    name: Apply database migrations
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          MISSING=()
          [[ -z "${DATABASE_URL}" ]] && MISSING+=("DATABASE_URL")
          [[ -z "${GHCR_PULL_TOKEN}" ]] && MISSING+=("GHCR_PULL_TOKEN")
          if (( ${#MISSING[@]} )); then
            echo "::error::Missing repository secret(s): ${MISSING[*]}"
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure containerapp CLI extension
        shell: bash
        run: |
          set -euo pipefail
          # `--upgrade` re-downloads the extension on every run; only install
          # when it is actually missing.
          if ! az extension show --name containerapp --only-show-errors >/dev/null 2>&1; then
            az extension add --name containerapp --yes --only-show-errors
          fi

      - name: Run migration job
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail

          COMMON_ARGS=(
            --name "${MIGRATION_JOB_NAME}"
            --resource-group "${RESOURCE_GROUP}"
            --image "${IMAGE}"
            # The image entrypoint takes `migrate` as a subcommand. Passing
            # `--command python -m app.migrate` instead makes the az CLI treat
            # `-m` as one of its own options and fail with
            # "unrecognized arguments".
            --args "migrate"
            --secrets "database-url=${DATABASE_URL}"
            --env-vars "DATABASE_URL=secretref:database-url"
            # The package is private, so the job needs credentials to pull it.
            --registry-server "${REGISTRY}"
            --registry-username "${GHCR_USERNAME}"
            --registry-password "${GHCR_PULL_TOKEN}"
            --only-show-errors
          )

          if az containerapp job show --name "${MIGRATION_JOB_NAME}" \
              --resource-group "${RESOURCE_GROUP}" --only-show-errors >/dev/null 2>&1; then
            az containerapp job update "${COMMON_ARGS[@]}"
          else
            az containerapp job create "${COMMON_ARGS[@]}" \
              --environment "${CONTAINER_ENV}" \
              --trigger-type Manual \
              --replica-timeout 600 \
              --replica-retry-limit 1 \
              --cpu 0.5 --memory 1.0Gi
          fi

          echo "Starting migration job..."
          EXECUTION=$(az containerapp job start \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query name -o tsv --only-show-errors)
          echo "Execution: ${EXECUTION}"

          # `job start` returns as soon as the execution is queued, so poll it.
          for _ in $(seq 1 60); do
            STATUS=$(az containerapp job execution show \
              --name "${MIGRATION_JOB_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --job-execution-name "${EXECUTION}" \
              --query properties.status -o tsv --only-show-errors)
            echo "Migration status: ${STATUS}"
            case "${STATUS}" in
              Succeeded) exit 0 ;;
              Failed|Cancelled)
                echo "::error::Migration job ${EXECUTION} finished with status ${STATUS}."
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Migration job ${EXECUTION} did not finish within 10 minutes."
          exit 1

  # ---------------------------------------------------------------------
  # 3) Deploy
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy revision
    needs: [build, migrate]
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure containerapp CLI extension
        shell: bash
        run: |
          set -euo pipefail
          if ! az extension show --name containerapp --only-show-errors >/dev/null 2>&1; then
            az extension add --name containerapp --yes --only-show-errors
          fi

      - name: Deploy new revision
        id: deploy
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          echo "Deploying image: ${IMAGE}"

          # The package is private, so the app needs stored credentials to pull
          # it on every scale-from-zero, not just at deploy time.
          az containerapp registry set \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --server "${REGISTRY}" \
            --username "${GHCR_USERNAME}" \
            --password "${GHCR_PULL_TOKEN}" \
            --only-show-errors

          # A revision suffix makes it possible to tell at a glance which commit
          # a running revision came from.
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${IMAGE}" \
            --revision-suffix "sha-$(echo "${GITHUB_SHA}" | cut -c1-8)" \
            --only-show-errors

          FQDN=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: bash
        env:
          FQDN: ${{ steps.deploy.outputs.fqdn }}
        run: |
          set -euo pipefail
          # The app scales to zero, so the first request also pays for a cold
          # start; retry rather than assuming an instant response.
          for attempt in $(seq 1 20); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "https://${FQDN}/health" || true)
            if [[ "${CODE}" == "200" ]]; then
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: /health returned '${CODE}'"
            sleep 10
          done
          echo "::error::Health check never returned 200 for https://${FQDN}/health"
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend deploy"
            echo ""
            echo "- **Version:** ${{ needs.build.outputs.version }}"
            echo "- **Image:** \`${{ needs.build.outputs.image }}\`"
            echo "- **URL:** https://${{ steps.deploy.outputs.fqdn }}"
          } >> "$GITHUB_STEP_SUMMARY"
